<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trade Nova</title>
<style>html,body{margin:0;height:100%;background:#0B2C6E;color:#fff;font:600 16px system-ui,Roboto,sans-serif}
#s{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#s img{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.35)}#s small{color:#BFD2FF;font-weight:500}</style></head>
<body><div id="s"><img src="icon.png" alt=""><div>Trade Nova</div><small>Smarter Trade. Greater Confidence</small></div>
<script>
/* Trade Nova bootloader — part of the installed app. Picks the newest verified app bundle:
   the one downloaded by the updater (stored in IndexedDB) or the one built into this APK. */
(function(){
var NATIVE=__NATIVE_CODE__, BUILTIN='__APP_VERSION__';
function vcmp(a,b){a=String(a).split('.').map(Number);b=String(b).split('.').map(Number);for(var i=0;i<Math.max(a.length,b.length);i++){var d=(a[i]||0)-(b[i]||0);if(d)return d>0?1:-1}return 0}
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function builtin(){ ls('tn-running',BUILTIN); location.replace('app.html'); }
function run(b){
  var h=b.files['index.html'];
  var O='<scr'+'ipt', C='</scr'+'ipt>';
  ['hsdata.js','prices.js'].forEach(function(n){ if(b.files[n]) h=h.split(O+' src="'+n+'">'+C).join(O+'>'+b.files[n].replace(/<\/(script)/gi,'<\\/$1')+C); });
  ls('tn-running',b.content); ls('tn-boot-pending',b.content);
  document.open(); document.write(h); document.close();
}
ls('tn-native',NATIVE);
try{
  var r=indexedDB.open('tn-ota',1);
  r.onupgradeneeded=function(){ r.result.createObjectStore('b') };
  r.onerror=builtin;
  r.onsuccess=function(){
    var g=r.result.transaction('b').objectStore('b').get('bundle');
    g.onerror=builtin;
    g.onsuccess=function(){
      var b=g.result, bad=ls('tn-bad');
      if(ls('tn-boot-pending')&&b&&ls('tn-boot-pending')===b.content){ ls('tn-bad',b.content); localStorage.removeItem('tn-boot-pending'); return builtin(); }  /* last start of this update failed */
      if(b&&b.files&&b.files['index.html']&&vcmp(b.content,BUILTIN)>0&&(b.minNative||0)<=NATIVE&&bad!==b.content) run(b); else builtin();
    };
  };
}catch(e){ builtin(); }
})();
</script></body></html>
