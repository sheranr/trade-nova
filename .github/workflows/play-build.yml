name: Build Google Play bundle

# Builds the Google Play version of Trade Nova (play/).
# Runs only on the play-store branch, so main, GitHub Pages, the admin page and the
# sideloaded APK release are not touched. The app content is taken from main (latest).
# Output (Actions run -> Artifacts):
#   trade-nova-play-aab  : unsigned .aab, to be signed with the upload key and uploaded to Play
#   trade-nova-play-test : test APK ("Trade Nova (test)") that installs next to the real app
on:
  push:
    branches: [play-store]
    paths: ['play/**', '.github/workflows/play-build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Use the latest app content from main
        run: |
          git fetch --depth 1 origin main
          git checkout FETCH_HEAD -- docs android/assets-src
          sh play/prepare.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        working-directory: play
        run: gradle --no-daemon bundleRelease assembleDebug

      - name: Check the build (package, version, target SDK, permissions)
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT2" dump badging play/app/build/outputs/apk/debug/*.apk | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|application-label:)"
          "$AAPT2" dump xmltree --file AndroidManifest.xml play/app/build/outputs/apk/debug/*.apk | grep -iE "enableOnBackInvokedCallback|minSdk|targetSdk" || true
          unzip -l play/app/build/outputs/bundle/release/*.aab | grep -E "manifest|assets/(index|app)\.html|hsdata|classes|\.so$" || true
          ls -la play/app/build/outputs/bundle/release/ play/app/build/outputs/apk/debug/

      - name: Save the outputs to the play-builds branch
        run: |
          mkdir -p /tmp/out && cp play/app/build/outputs/bundle/release/*.aab /tmp/out/TradeNova-play-unsigned.aab
          cp play/app/build/outputs/apk/debug/*.apk /tmp/out/TradeNova-play-test.apk
          cd /tmp/out && git init -q -b play-builds && git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Play build from ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" play-builds

      - uses: actions/upload-artifact@v4
        with:
          name: trade-nova-play-aab
          path: play/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: trade-nova-play-test
          path: play/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
