<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}/* v1.4: sources, alerts, circulars, sanctions, terms, PDF viewer */
.iconbtn{position:relative}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#FF4D5E;color:#fff;font:700 11px/18px var(--f-body);text-align:center;border:2px solid var(--hdr-b)}
.srcbox{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.srcrow{display:flex;gap:10px;align-items:flex-start}
.srcrow>.ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--sky);color:var(--blue);display:grid;place-items:center}
.srcrow>.ic svg{width:18px;height:18px}
.srcrow b{display:block;font-size:13px}
.srcrow span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
.checked{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ok);background:var(--ok-bg);border-radius:99px;padding:3px 10px;align-self:flex-start}
.checked svg{width:13px;height:13px}
.verify{border:1.5px solid var(--warn);background:var(--warn-bg);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.45}
.verify b{color:var(--warn)}
.hs .srcl{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.x[aria-pressed="true"]{color:#E3A008;border-color:#E3A008}
.x[aria-pressed="true"] svg{fill:currentColor}
/* pdf viewer */
.sheet.tall{max-height:97%;height:97%;display:flex;flex-direction:column}
.pdfbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--ground);position:sticky;top:0}
.pdfbar .pg{font-family:var(--f-mono);font-size:13px;min-width:74px;text-align:center}
.pdfbar .x{width:34px;height:34px}
.pdfwrap{flex:1;overflow:auto;padding:12px;background:color-mix(in srgb,var(--ground) 70%,#000 6%);-webkit-overflow-scrolling:touch}
.pdfwrap canvas{display:block;margin:0 auto;background:#fff;box-shadow:var(--shadow);border-radius:4px;max-width:none}
.pdfmsg{padding:24px;text-align:center;color:var(--muted)}
/* alerts */
.alert{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--info);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.alert.critical{border-left-color:var(--bad)} .alert.warn{border-left-color:var(--warn)}
.alert.new{box-shadow:0 0 0 2px color-mix(in srgb,var(--blue-2) 30%,transparent)}
.alert .top2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.alert b.t{font-family:var(--f-display);font-size:15px;line-height:1.3}
.dot-new{font-size:11px;font-weight:800;color:var(--blue);letter-spacing:.06em;text-transform:uppercase}
.watchhit{font-size:12.5px;font-weight:700;color:var(--bad)}
/* circulars */
.circ{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.circ b.t{font-family:var(--f-display);font-size:15.5px;line-height:1.3}
.circ .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.secgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.secgrid button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 0;font:600 13px var(--f-mono);color:var(--blue);cursor:pointer}
.secgrid button:hover{border-color:var(--blue-2)}
/* sanctions */
.flag-red{border-left:4px solid var(--bad)} .flag-amb{border-left:4px solid var(--warn)}
.clist{display:flex;flex-wrap:wrap;gap:6px}
.clist span{font-size:12.5px;padding:4px 9px;border-radius:8px;background:var(--sky);color:var(--ink)}
.clist.bad span{background:var(--bad-bg);color:var(--bad);font-weight:700}
.clist.warn span{background:var(--warn-bg);color:var(--warn);font-weight:600}
.clist.susp span{background:var(--susp-bg);color:var(--susp);font-weight:600}
.result{border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.result.bad{background:var(--bad-bg);color:var(--bad)} .result.ok{background:var(--ok-bg);color:var(--ok)} .result.warn{background:var(--warn-bg);color:var(--warn)}
.linkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.linkgrid a{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--ink);font-size:13px;font-weight:600}
.linkgrid a svg{width:16px;height:16px;color:var(--blue);flex:none}
.linkgrid a:hover{border-color:var(--blue-2)}
.terms h3{font-size:15px;margin-top:4px}
.terms p,.terms li{font-size:13.5px;line-height:1.55;margin:0}
.terms ol,.terms ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.foot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:4px 2px}
/* world price check */
.wpbench{background:var(--sky);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.wpbig{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wpbig b{font-size:26px;font-weight:600;color:var(--ink)}
.wpbig span{font-size:13px;color:var(--muted)}
.wpmini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wpmini div{background:var(--paper);border-radius:8px;padding:5px 8px}
.wpmini span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.wpmini b{font-size:13.5px}
.wpscale{position:relative;height:30px;margin:4px 6px 0;border-bottom:2px solid var(--line)}
.wpscale .band{position:absolute;top:8px;height:14px;background:var(--ok-bg);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);border-radius:4px}
.wpscale .rng{position:absolute;top:13px;height:4px;background:var(--muted);opacity:.5;border-radius:2px}
.wpscale i{position:absolute;top:2px;width:3px;height:26px;margin-left:-1.5px;border-radius:2px}
.wpscale .bm{background:var(--ink)}
.wpscale .iv{width:12px;height:12px;margin-left:-6px;top:9px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--ink)}
.iv.ok{background:var(--ok)} .iv.warn{background:var(--warn)} .iv.bad{background:var(--bad)}
.wplegend{display:flex;gap:12px;flex-wrap:wrap}
.wplegend .k{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.k.band{background:var(--ok-bg);border:1px solid var(--ok)} .k.rng{background:var(--muted);opacity:.5} .k.bm{background:var(--ink);width:3px} .k.iv{background:var(--blue);border-radius:50%}
/* v1.5 invoice price check */
.pband{position:relative;height:34px;margin:6px 4px 2px;border-radius:8px;background:var(--sky)}
.pband span{position:absolute;top:50%;transform:translate(-50%,-50%)}
.pb-range{height:14px;transform:translateY(-50%)!important;background:color-mix(in srgb,var(--ok) 35%,transparent);border-radius:6px}
.pb-med{width:2px;height:22px;background:var(--ok)}
.pb-orig{width:12px;height:12px;border-radius:3px;background:var(--blue);transform:translate(-50%,-50%) rotate(45deg)!important}
.pb-me{width:18px;height:18px;border-radius:50%;background:var(--ok);border:3px solid var(--paper);box-shadow:0 0 0 1.5px var(--ok)}
.pb-me.warn{background:var(--warn);box-shadow:0 0 0 1.5px var(--warn)} .pb-me.bad{background:var(--bad);box-shadow:0 0 0 1.5px var(--bad)}
.pb-leg{display:flex;flex-wrap:wrap;gap:6px 14px}
.pb-leg span{display:inline-flex;align-items:center;gap:6px}
.pb-leg i{display:inline-block;width:12px;height:10px;border-radius:3px}
.lg-range{background:color-mix(in srgb,var(--ok) 35%,transparent)} .lg-med{width:2px!important;height:12px!important;background:var(--ok)}
.lg-orig{width:9px!important;height:9px!important;background:var(--blue);transform:rotate(45deg)}
.lg-me{border-radius:50%!important;background:var(--ok)} .lg-me.warn{background:var(--warn)} .lg-me.bad{background:var(--bad)}
/* v2.0 OTA banner */
.otabar{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:60;width:calc(100% - 24px);max-width:680px;background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 10px 10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13.5px}
.otabar>span{flex:1;min-width:0;display:flex;gap:8px;align-items:flex-start;line-height:1.35}
.otabar>span svg{width:18px;height:18px;flex:none;margin-top:1px}
.otabar .x{background:transparent;border-color:color-mix(in srgb,var(--paper) 30%,transparent);color:var(--paper)}
</style>
<title>Trade Nova</title>
<meta name="description" content="Trade Nova — HS codes, import control, levies and trade finance tools for Sri Lanka.">
<meta name="theme-color" content="#061426"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Trade Nova">
<style>
/* Layout: phone-first single column (max 720px) with a fixed bottom tab bar; deep-blue "instrument panel" header, white working surfaces, HS codes set in mono as the recurring signature. */
:root{
  --ink:#0A1F44;          /* deep navy text / header */
  --blue:#1650D8;         /* primary action blue */
  --blue-2:#3B7BFF;       /* bright highlight */
  --sky:#EAF1FF;          /* tinted surface */
  --paper:#FFFFFF;        /* card surface */
  --ground:#F5F8FE;       /* page ground, blue-biased white */
  --line:#D9E3F5;         /* hairlines */
  --muted:#56688C;        /* secondary text */
  --hdr-a:#0B2C6E; --hdr-b:#1650D8; --hdr-fg:#FFFFFF; --hdr-muted:#BFD2FF;
  --ok:#0F8A5F; --ok-bg:#E3F6EE;
  --warn:#A86200; --warn-bg:#FFF2DC;
  --bad:#C62839; --bad-bg:#FDE7EA;
  --susp:#B4430E; --susp-bg:#FDEBDD;
  --info:#1650D8; --info-bg:#E6EEFF;
  --teal:#0A7A86; --teal-bg:#DFF5F7; --hcfc:#6D28D9; --hcfc-bg:#F1EAFE; --pay:#0369A1; --pay-bg:#E0F2FE;
  --shadow:0 1px 2px rgba(10,31,68,.06),0 6px 20px rgba(10,31,68,.06);
  --f-display:"Sora","Google Sans",Roboto,ui-sans-serif,system-ui,sans-serif;
  --f-body:Roboto,"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E8EEFC; --blue:#5B8CFF; --blue-2:#82A9FF; --sky:#16244A; --paper:#111C38; --ground:#0A1430; --line:#22335E; --muted:#9AAAD0;
  --hdr-a:#0B1C45; --hdr-b:#1A3F9E; --hdr-fg:#FFFFFF; --hdr-muted:#A9BEF2;
  --ok:#43C995; --ok-bg:#0F3328; --warn:#F2B049; --warn-bg:#3A2A0C; --bad:#FF6B7A; --bad-bg:#3D1219; --susp:#FF9A5C; --susp-bg:#3B1F0E; --info:#82A9FF; --info-bg:#172B5C; --teal:#4FD1DC; --teal-bg:#0C3238; --hcfc:#C4A1FF; --hcfc-bg:#2B1A4D; --pay:#7DD3FC; --pay-bg:#0C2E44;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#E8EEFC; --blue:#5B8CFF; --blue-2:#82A9FF; --sky:#16244A; --paper:#111C38; --ground:#0A1430; --line:#22335E; --muted:#9AAAD0;
  --hdr-a:#0B1C45; --hdr-b:#1A3F9E; --hdr-fg:#FFFFFF; --hdr-muted:#A9BEF2;
  --ok:#43C995; --ok-bg:#0F3328; --warn:#F2B049; --warn-bg:#3A2A0C; --bad:#FF6B7A; --bad-bg:#3D1219; --susp:#FF9A5C; --susp-bg:#3B1F0E; --info:#82A9FF; --info-bg:#172B5C; --teal:#4FD1DC; --teal-bg:#0C3238; --hcfc:#C4A1FF; --hcfc-bg:#2B1A4D; --pay:#7DD3FC; --pay-bg:#0C2E44;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue-2);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{max-width:720px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(135deg,var(--hdr-a),var(--hdr-b));color:var(--hdr-fg);padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;background:none;border:0;padding:0;cursor:pointer;color:inherit;text-align:left}
.mark{width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.1}
.brand small{display:block;color:var(--hdr-muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
main{padding:16px;display:flex;flex-direction:column;gap:18px}
/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs nav{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
@media (max-width:420px){.tab{font-size:10.5px}.tab svg{width:20px;height:20px}}
.tab span{text-align:center;line-height:1.1}
.tab{justify-content:flex-start;border:0;background:none;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--blue);background:var(--sky)}
/* generic */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-size:17px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;font-size:14.5px}
.btn svg{width:18px;height:18px}
.btn.ghost{background:var(--sky);color:var(--blue)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 13px;outline:none}
.input:focus{border-color:var(--blue-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue-2) 22%,transparent)}
textarea.input{resize:vertical;min-height:84px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-family:var(--f-display)}
.empty>svg{width:30px;height:30px;color:var(--blue)}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding:2px 0 2px 10px}
/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)}
.p-susp{background:var(--susp-bg);color:var(--susp)} .p-info{background:var(--info-bg);color:var(--info)} .p-hcfc{background:var(--hcfc-bg);color:var(--hcfc)}
.notice{border:1.5px solid var(--hcfc);background:var(--hcfc-bg);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.notice .eyebrow{color:var(--hcfc)}
.notice b.t{font-family:var(--f-display);font-size:15px}
.regcard{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;cursor:pointer;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--hcfc);border-radius:var(--r);padding:14px}
.regcard:hover{border-color:var(--hcfc)}
.sched{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.sched table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:440px}
.sched th,.sched td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.sched th{background:var(--sky);font-weight:700}
.sched td.mono{color:var(--blue)}

.banks{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:560px){.banks{grid-template-columns:1fr 1fr}}
.bank{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.bank:hover{border-color:var(--blue-2);box-shadow:var(--shadow)}
.bank-main{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit}
.bmono{flex:none;width:56px;height:56px;border-radius:14px;color:#fff;display:grid;place-items:center;font:800 16px var(--f-display);letter-spacing:-.02em}
.binfo{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.binfo b{font-family:var(--f-display);font-size:16px}
.burl{font-size:11.5px;color:var(--blue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bgo{flex:none;width:36px;height:36px;border-radius:10px;background:var(--sky);color:var(--blue);display:grid;place-items:center}
.bgo svg{width:18px;height:18px}
.bank .cbtn{align-self:flex-start}
.notice.pay{border-color:var(--pay);background:var(--pay-bg)} .notice.pay .eyebrow{color:var(--pay)}
.regcard.pay{border-left-color:var(--pay)} .regcard.pay:hover{border-color:var(--pay)}
.p-pay{background:var(--pay-bg);color:var(--pay)}
.condbox{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--paper);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.cond{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.cond:last-of-type{border-bottom:0}
.cond>span:first-child{min-width:45%}
.cond>span:last-child{max-width:52%}
.p-teal{background:var(--teal-bg);color:var(--teal)}
/* hero */
.hero{border-radius:20px;padding:20px 18px 18px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#3B7BFF 0%,transparent 55%),linear-gradient(160deg,#0B2C6E,#123F9E 70%,#1650D8);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.hero::after{content:"";position:absolute;inset:auto -30px -40px auto;width:220px;height:220px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2px,transparent 2px 9px);border-radius:50%;pointer-events:none}
.hero .hi{font-size:13px;color:#C7D8FF;font-weight:600}
.hero h1{font-size:25px;line-height:1.2;font-weight:700;max-width:22ch}
.hero .code{font-family:var(--f-mono);font-size:12px;color:#C7D8FF;display:flex;gap:6px;flex-wrap:wrap}

.searchbar{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:5px 5px 5px 13px;position:relative;z-index:1}
.searchbar svg{width:19px;height:19px;color:#56688C;flex:none}
.searchbar input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#0A1F44;font-size:15px;padding:8px 0}
.searchbar input::placeholder{color:#7D8CAB}
.searchbar .btn{padding:9px 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:9px 10px}
.stat b{display:block;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:#C7D8FF;line-height:1.25;display:block}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:118px;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sky);color:var(--blue)}
.tile .ic svg{width:22px;height:22px}
.tile b{font-family:var(--f-display);font-size:15px;line-height:1.25}
.tile span{font-size:12.5px;color:var(--muted);line-height:1.35}
.tile.feature{grid-column:span 2;flex-direction:row;align-items:center;min-height:0;background:#0B2C6E;color:#fff;border-color:#0B2C6E}
.tile.feature span{color:#C7D8FF}
.tile.feature .ic{background:var(--blue);color:#fff}

/* updates */
.update{display:flex;gap:12px;align-items:flex-start}
.update .d{flex:none;width:46px;text-align:center;background:var(--sky);border-radius:10px;padding:6px 0;font-family:var(--f-display);color:var(--blue);line-height:1.1}
.update .d b{display:block;font-size:17px}
.update .d small{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
/* HS results */
.res{display:flex;flex-direction:column;gap:8px}
.hs{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;cursor:pointer;text-align:left;width:100%}
.hs:hover{border-color:var(--blue-2)}
.hs>span:nth-child(2){display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.hs .c{font-family:var(--f-mono);font-weight:600;font-size:15px;color:var(--blue);letter-spacing:.01em}
.hs .t{grid-column:1/-1;font-size:14px;line-height:1.4}
.hs .pth{grid-column:1/-1;font-size:12px;color:var(--muted);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hs .rates{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hs .rates b{color:var(--ink);font-weight:600}
.hs.group{background:transparent;border-style:dashed}
.code-seg{font-family:var(--f-mono);display:inline-flex;gap:0}
.code-seg em{font-style:normal;opacity:.55}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,14,36,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ground);width:100%;max-width:720px;max-height:92%;border-radius:22px 22px 0 0;overflow:auto;padding:0 0 calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.tile{transition:none}}
.sheet-h{position:sticky;top:0;background:var(--ground);padding:14px 16px 10px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);z-index:2}
.sheet-h .grow{flex:1;min-width:0}
.sheet-b{padding:16px;display:flex;flex-direction:column;gap:14px}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer;flex:none}
.x svg{width:18px;height:18px}
.big-code{font-family:var(--f-mono);font-size:26px;font-weight:600;color:var(--blue);letter-spacing:.02em}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kv div{background:var(--paper);padding:9px 12px;min-width:0}
.kv span{display:block;font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kv b{font-variant-numeric:tabular-nums;font-weight:600;font-size:14.5px;overflow-wrap:anywhere}

.trail{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.trail div{padding-left:12px;border-left:2px solid var(--line)}
.trail div:last-child{border-color:var(--blue);color:var(--ink);font-weight:600}
.est table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}

.flow{display:flex;flex-direction:column;gap:0;counter-reset:s}

.flow li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font:700 12px/24px var(--f-display);text-align:center}
.flow li::after{content:"";position:absolute;left:11.5px;top:26px;bottom:2px;width:1px;background:var(--line)}

.flow{padding:0;margin:0}
.ticks{padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.ticks li{list-style:none;padding-left:24px;position:relative;font-size:14px}
.ticks li::before{content:"";position:absolute;left:3px;top:6px;width:11px;height:6px;border-left:2px solid var(--ok);border-bottom:2px solid var(--ok);transform:rotate(-45deg)}
.risks li::before{border:0;width:8px;height:8px;border-radius:2px;background:var(--warn);transform:none;top:7px}
details.acc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.acc>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .grow{flex:1;min-width:0}
details.acc>summary b{font-family:var(--f-display);font-size:15.5px;display:block}
details.acc>summary small{color:var(--muted);font-size:12.5px;display:block;line-height:1.35}
details.acc>summary .chev{width:18px;height:18px;color:var(--muted);transition:transform .2s;flex:none}
details.acc[open]>summary .chev{transform:rotate(180deg)}
details.acc .in{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--sky);color:var(--blue);font-family:var(--f-mono)}
.desk-hero{border-radius:18px;padding:18px;background:linear-gradient(150deg,#0B2C6E,#1650D8);color:#fff;display:flex;flex-direction:column;gap:8px}
.desk-hero p{margin:0;color:#C7D8FF;font-size:14px}

.desk-hero h1{font-size:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sky);border-radius:12px;padding:4px;gap:4px}

.vgrid{display:grid;grid-template-columns:1fr;gap:12px}

.thumb .dur{position:absolute;right:10px;bottom:10px;font:600 11.5px var(--f-mono);background:rgba(0,0,0,.45);padding:2px 7px;border-radius:6px}
.thumb .big{position:absolute;left:12px;bottom:8px;font:800 34px/1 var(--f-display);opacity:.16;letter-spacing:-.03em;text-align:left;max-width:80%}
.thumb video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.vbody{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}

.done{color:var(--ok);font-size:12px;font-weight:700;display:inline-flex;gap:4px;align-items:center}

.msg.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.ai p{margin:0 0 8px}.msg.ai p:last-child{margin:0}

.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--ground);padding:8px 0}

.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}

.avatar{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:700 15px var(--f-display);color:#fff;grid-row:span 3}
.person b{font-family:var(--f-display);font-size:15px}
.contact{display:flex;gap:6px;flex-wrap:wrap;grid-column:2}
.cbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--ground);border-radius:9px;padding:5px 9px;font-size:12.5px;cursor:pointer;color:var(--ink);max-width:100%;overflow-wrap:anywhere;text-align:left}
a.cbtn{text-decoration:none}
.cbtn svg{width:14px;height:14px;color:var(--muted);flex:none}
/* english */
.word{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.word:last-child{border-bottom:0}
.word b{font-size:15px}
.word .say{font-family:var(--f-mono);font-size:13px;color:var(--blue);text-align:right}
.word .say u{text-decoration:none;background:var(--sky);padding:0 3px;border-radius:4px;font-weight:700}
.swap{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.swap:last-child{border-bottom:0}
.swap s{color:var(--bad);text-decoration-thickness:1px}
.swap span{color:var(--ok);font-weight:600}
/* admin */
.list-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.list-item .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:80;max-width:calc(100% - 32px)}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}

.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--blue);border-radius:99px}
.qa{display:flex;flex-direction:column;gap:8px}
.qa button{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:14px}
.qa button:hover{border-color:var(--blue-2)}
.ucp{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.ucp:last-child{border-bottom:0}
.ucp .tag{min-width:58px;text-align:center}

html:root{
  --f-display:"Inter",Roboto,ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",Roboto,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --r-sm:12px;
  --gold-h:#F3BA55; --gold-hi:#FFD27E;           /* gold used on the always-dark chrome (header, hero, splash) */
  --navy-0:#061426; --navy-1:#0B2038; --navy-2:#112B46;
  --ease:cubic-bezier(.2,.7,.2,1);
}
html:root[data-theme="dark"]{
  --ink:#F5F8FF; --blue:#168BFF; --blue-2:#4FA8FF; --sky:#0F2A48; --paper:#112B46; --ground:#061426; --line:#1F3B5E; --muted:#A7BED4;
  --field:#0B2038; --surface-2:#0B2038;
  --hdr-a:#061426; --hdr-b:#0B2038; --hdr-fg:#F5F8FF; --hdr-muted:#A7BED4;
  --ok:#12C996; --ok-bg:#0C3534; --warn:#FFB547; --warn-bg:#3A2C12; --bad:#F25B65; --bad-bg:#3D1624; --susp:#FF8F57; --susp-bg:#3B2116;
  --info:#4FA8FF; --info-bg:#0F2F57; --teal:#2FD3E0; --teal-bg:#0A3442; --hcfc:#B9A0FF; --hcfc-bg:#251F50; --pay:#5CC8FF; --pay-bg:#0B3152;
  --gold:#F3BA55; --gold-bg:#33290F;
  --shadow:0 1px 0 rgba(255,255,255,.035) inset,0 12px 28px -12px rgba(0,0,0,.55);
  --card-grad:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,0) 60%);
  color-scheme:dark}
html:root[data-theme="light"]{
  --ink:#0A1A2F; --blue:#0A6FE0; --blue-2:#168BFF; --sky:#EAF2FD; --paper:#FFFFFF; --ground:#F2F5F9; --line:#DCE3EC; --muted:#4F627A;
  --field:#FFFFFF; --surface-2:#E9EEF5;
  --hdr-a:#061426; --hdr-b:#0B2038; --hdr-fg:#F5F8FF; --hdr-muted:#A7BED4;
  --ok:#0A8A66; --ok-bg:#E0F5EE; --warn:#9A5B00; --warn-bg:#FFF0D6; --bad:#C42A3B; --bad-bg:#FCE7EA; --susp:#B4430E; --susp-bg:#FDEBDD;
  --info:#0A6FE0; --info-bg:#E4EFFE; --teal:#0A7A86; --teal-bg:#DFF5F7; --hcfc:#6D28D9; --hcfc-bg:#F1EAFE; --pay:#0369A1; --pay-bg:#E0F2FE;
  --gold:#A8731A; --gold-bg:#FBF1DC;
  --shadow:0 1px 2px rgba(6,20,38,.05),0 10px 24px -10px rgba(6,20,38,.14);
  --card-grad:none;
  color-scheme:light}

/* ---- base ---- */
html body{font-family:var(--f-body);font-size:15px;letter-spacing:-.003em;font-feature-settings:"cv11","ss01"}
html[data-theme="dark"] body{background:radial-gradient(900px 420px at 50% -160px,#0E2C50 0%,rgba(14,44,80,0) 70%) no-repeat,var(--ground)}
h1,h2,h3{font-weight:750;letter-spacing:-.022em}
.sec-h h2{font-size:17px}
.eyebrow{letter-spacing:.12em;font-size:11px;font-weight:700}
.mono,.hs .c,.big-code,.tag{font-feature-settings:"tnum"}
::selection{background:rgba(22,139,255,.35)}

/* ---- header ---- */
.top{background:linear-gradient(180deg,rgba(6,20,38,.97),rgba(11,32,56,.94));-webkit-backdrop-filter:saturate(140%) blur(14px);backdrop-filter:saturate(140%) blur(14px);border-bottom:1px solid rgba(243,186,85,.16);padding:10px 14px;box-shadow:0 8px 24px -16px rgba(0,0,0,.6)}
.mark{width:38px;height:38px;border-radius:11px;background:#061426;box-shadow:0 0 0 1px rgba(243,186,85,.35),0 6px 16px -6px rgba(22,139,255,.55)}
.mark img{width:38px!important;height:38px!important;border-radius:11px!important}
.brand b{font-size:19px;font-weight:800;letter-spacing:-.03em;color:#F5F8FF}
.brand b .nova{color:var(--gold-h);background:linear-gradient(180deg,#FFE3A6,#F3BA55 55%,#C98E2B);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand small{font-size:11.5px;letter-spacing:.02em;color:#A7BED4}
.iconbtn{border-radius:12px;border:1px solid rgba(167,190,212,.2);background:rgba(255,255,255,.04);color:#DCE7F5;transition:background .15s,border-color .15s}
.iconbtn:hover{background:rgba(22,139,255,.14);border-color:rgba(22,139,255,.45)}
.badge{background:#F25B65;border-color:#061426}

/* ---- bottom navigation ---- */
.tabs{background:color-mix(in srgb,var(--ground) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
html[data-theme="dark"] .tabs{background:rgba(6,20,38,.9)}
.tab{position:relative;min-height:54px;justify-content:center;font-weight:600;letter-spacing:-.01em;transition:color .15s,background .15s}
.tab svg{transition:transform .2s var(--ease)}
.tab[aria-current="page"]{color:var(--blue-2);background:rgba(22,139,255,.12)}
html[data-theme="light"] .tab[aria-current="page"]{color:var(--blue);background:var(--sky)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-6px;left:50%;width:22px;height:3px;margin-left:-11px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,#C98E2B,#F3BA55,#FFD27E)}
.tab[aria-current="page"] svg{transform:translateY(-1px)}
@media (max-width:420px){.tab{font-size:10px;letter-spacing:-.02em}}

/* ---- surfaces ---- */
.card,.tile,.hs,.bank,.alert,.circ,details.acc,.vcard,.srcbox,.regcard,.condbox,.qa button,.linkgrid a,.secgrid button{box-shadow:var(--shadow)}
.card,.tile,.hs,.bank,.circ,details.acc,.vcard,.srcbox{background-image:var(--card-grad)}
.card,.tile,.hs,.bank,.alert,.circ,details.acc,.vcard,.srcbox,.regcard,.condbox,.notice,.empty{border-radius:var(--r)}
.tile,.hs,.bank,.regcard,.qa button,.linkgrid a{transition:transform .18s var(--ease),border-color .18s,box-shadow .18s}
.tile:active,.hs:active,.bank:active,.regcard:active,.deskcard:active,.qtile:active{transform:scale(.985)}
.hs:hover,.bank:hover,.regcard:hover{border-color:color-mix(in srgb,var(--blue) 55%,var(--line))}
.note{border-left-color:color-mix(in srgb,var(--gold) 55%,transparent)}
.empty{border-color:var(--line);background:color-mix(in srgb,var(--paper) 40%,transparent)}
.empty>svg{color:var(--blue-2)}

/* ---- controls ---- */
.btn{border-radius:12px;font-weight:700;letter-spacing:-.005em;background:linear-gradient(180deg,#2B98FF,#168BFF 55%,#0E78E6);box-shadow:0 8px 18px -10px rgba(22,139,255,.8),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:rgba(22,139,255,.13);color:var(--blue-2);box-shadow:none}
html[data-theme="light"] .btn.ghost{background:var(--sky);color:var(--blue)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink);box-shadow:none}
.btn.line:hover{border-color:color-mix(in srgb,var(--blue) 60%,var(--line))}
.btn.danger{background:var(--bad-bg);color:var(--bad);box-shadow:none}
.chip{background:var(--paper);border-color:var(--line);transition:background .15s,border-color .15s,color .15s}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 6px 16px -8px rgba(22,139,255,.9)}
.input,select.input,textarea.input{background:var(--field);border-color:var(--line);border-radius:12px;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(22,139,255,.22)}
.seg{background:var(--surface-2);border:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--blue-2);box-shadow:0 4px 14px -6px rgba(0,0,0,.4)}
html[data-theme="light"] .seg button[aria-pressed="true"]{color:var(--blue)}
.x{border-radius:11px;background:var(--paper);border-color:var(--line)}
.cbtn{background:var(--field);border-color:var(--line);border-radius:10px}
.tag{background:rgba(22,139,255,.12);color:var(--blue-2);border-radius:7px}
html[data-theme="light"] .tag{background:var(--sky);color:var(--blue)}
.pill{letter-spacing:-.005em}
.linkbtn{color:var(--blue-2)}
html[data-theme="light"] .linkbtn{color:var(--blue)}

/* ---- search ---- */
.searchbar{background:var(--field);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px;transition:border-color .2s,box-shadow .2s}
.searchbar svg{color:var(--muted)}
.searchbar input{color:var(--ink);font-size:15.5px}
.searchbar input::placeholder{color:color-mix(in srgb,var(--muted) 80%,transparent)}
.searchbar:focus-within{border-color:var(--blue)!important;box-shadow:0 0 0 4px rgba(22,139,255,.18),0 10px 30px -12px rgba(22,139,255,.55)}

.hero::after{display:none}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hero .hi{font-size:13px;color:#F5F8FF;font-weight:700;display:flex;flex-direction:column;gap:1px}
.hero .hi span{font-weight:500;color:#A7BED4;font-size:12px}
.hero h1{font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.03em;max-width:17ch;margin-top:58px;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.hero h1 em{font-style:normal;color:var(--gold-h)}
.hero .searchbar{background:rgba(6,20,38,.78);border:1px solid rgba(22,139,255,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hero .searchbar input{color:#F5F8FF}
.hero .searchbar input::placeholder{color:#8DA6C0}
.hero .searchbar svg{color:#7FB8FF}
.stats{gap:8px}
.stat{background:rgba(11,32,56,.72);border:1px solid rgba(167,190,212,.16);border-radius:14px;padding:10px 11px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.stat b{font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--gold-hi);background:linear-gradient(180deg,#FFE3A6,#F3BA55);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat span{color:#A7BED4;font-size:11.5px}
.hero .code{font-family:var(--f-body);font-weight:600;font-size:11.5px;color:#C9D7E6}
.hero .code span{background:rgba(243,186,85,.08);border:1px solid rgba(243,186,85,.28);border-radius:99px;padding:3px 10px}
.net{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;border-radius:99px;padding:4px 10px;white-space:nowrap;border:1px solid}
.net i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 25%,transparent)}
.net.on{color:#12C996;background:rgba(18,201,150,.12);border-color:rgba(18,201,150,.35)}
.net.off{color:#FFB547;background:rgba(255,181,71,.12);border-color:rgba(255,181,71,.4)}

/* ---- home sections ---- */
.qf{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.qf::-webkit-scrollbar{display:none}
.qf .pill{border:1px solid color-mix(in srgb,currentColor 28%,transparent);padding:7px 12px;font-size:12.5px;cursor:pointer;flex:none}
.desks2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.deskcard{position:relative;overflow:hidden;text-align:left;cursor:pointer;border-radius:18px;padding:14px;min-height:150px;display:flex;flex-direction:column;gap:8px;color:#F5F8FF;border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 36px -22px rgba(0,0,0,.8);transition:transform .18s var(--ease)}
.deskcard.imp{background:radial-gradient(120% 90% at 100% 0%,rgba(79,168,255,.55),transparent 60%),linear-gradient(155deg,#0E3A6E,#0B2038)}
.deskcard.exp{background:radial-gradient(120% 90% at 100% 0%,rgba(243,186,85,.42),transparent 60%),linear-gradient(155deg,#2A2A3E,#0B2038)}
.deskcard b{font-size:16px;font-weight:800;letter-spacing:-.02em}
.deskcard>span:not(.ic){font-size:12.5px;color:#C9D7E6;line-height:1.35}
.deskcard .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}
.deskcard .ic svg{width:22px;height:22px}
.deskcard .go{position:absolute;right:12px;bottom:12px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.deskcard .go svg{width:16px;height:16px;transform:rotate(-90deg)}

/* ---- motion ---- */
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

#view.vin>*:nth-child(2){animation-delay:.03s} #view.vin>*:nth-child(3){animation-delay:.06s} #view.vin>*:nth-child(4){animation-delay:.09s} #view.vin>*:nth-child(n+5){animation-delay:.12s}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

.skel.hs-sk{height:104px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- splash ---- */
#splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:#F5F8FF;
  background:radial-gradient(60% 40% at 50% 42%,rgba(22,139,255,.28),transparent 70%),radial-gradient(120% 80% at 50% 120%,rgba(243,186,85,.14),transparent 60%),#061426;transition:opacity .38s ease,visibility .38s}
#splash.out{opacity:0;visibility:hidden}
#splash .ring{position:relative;width:118px;height:118px;border-radius:30px;padding:3px;background:linear-gradient(140deg,#FFE3A6,#F3BA55 40%,#168BFF);box-shadow:0 20px 60px -10px rgba(22,139,255,.55);animation:sp-in .7s var(--ease) both}
#splash .ring img{width:112px;height:112px;border-radius:27px;display:block}
#splash b{font-size:30px;font-weight:800;letter-spacing:-.035em;animation:sp-in .7s .08s var(--ease) both}
#splash b span{background:linear-gradient(180deg,#FFE3A6,#F3BA55 55%,#C98E2B);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#splash small{color:#A7BED4;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;animation:sp-in .7s .14s var(--ease) both}
#splash .bar{width:120px;height:2px;border-radius:2px;background:rgba(167,190,212,.18);overflow:hidden;margin-top:10px}
#splash .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,#F3BA55,transparent);animation:sp-bar 1s ease-in-out infinite}
@keyframes sp-in{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes sp-bar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

@media (prefers-reduced-motion:reduce){
  #view.vin>*,#splash .ring,#splash b,#splash small,#splash .bar i,.skel{animation:none!important}

}

const COLS = {};
async function loadData(){
  try{
    const d = window.HSDATA;
    d.cols.forEach((c,i)=>COLS[c]=i);
    S.data = d;
    S.rows = d.rows.map(a=>{
      const o={}; d.cols.forEach((c,i)=>o[c]=a[i]);
      o.k=o.c.replace(/\./g,'');
      o.hd=d.heads[o.h]||'';
      o.reg=regFor(o,d.notices||[]);
      o.st=status(o);
      o.grp=!o.gd && !o.vat && !o.u && !o.icl_only;
      o.txt=(o.c+' '+o.d+' '+o.p+' '+o.hd+' '+(o.cond||[]).map(x=>x[0]).join(' ')).toLowerCase();
      return o;
    });
  }catch(e){ S.loadErr=true }
  S.loading=false; render();
}
function regFor(o,notices){
  const out=[];
  for(const n of notices) for(const r of n.rules){
    const hit=(r.headings&&r.headings.includes(o.h))||(r.codes&&r.codes.some(c=>{const k=c.replace(/\./g,'');return o.k===k||o.k.startsWith(k)}));
    if(hit) out.push({n,r});
  }
  return out;
}
function status(o){
  const icl=(o.icl||'').toUpperCase().trim(); let ctl=(o.ctl||'').split(',').filter(Boolean);
  if(!icl&&o.cond&&o.cond.length){ const cfl=new Set(o.cond.flatMap(([,f])=>String(f).split('/'))); ctl=ctl.filter(x=>!cfl.has(x==='SL'?'LS':x)); }
  const out=[];
  if(icl.startsWith('B')||ctl.includes('B')) out.push(['bad','Banned']);
  else if(icl.startsWith('LS')||ctl.includes('SL')) out.push(['susp','ICL suspended']);
  else if(icl==='L'||icl.startsWith('L/')||ctl.includes('L')) out.push(['warn','Licence required']);
  if(icl==='S'||icl.includes('/S')) out.push(['info','SLSI inspection']);
  if(ctl.includes('AQ')) out.push(['teal','Animal quarantine cert.']);
  if(ctl.includes('NPQS')) out.push(['teal','Plant quarantine cert.']);
  const cf=new Set(); (o.cond||[]).forEach(([,f])=>String(f).split('/').forEach(x=>cf.add(x)));
  const has=k=>out.some(x=>x[0]===k);
  if(cf.has('B')&&!has('bad')) out.push(['bad','Some goods banned']);
  if(cf.has('LS')&&!has('susp')) out.push(['susp','Some goods ICL suspended']);
  if(cf.has('L')&&!has('warn')) out.push(['warn','Some goods need licence']);
  if(cf.has('S')&&!has('info')) out.push(['info','Some goods need SLSI']);
  if(!out.length) out.push(['ok','No ICL listed']);
  for(const {r} of (o.reg||[])) out.push([r.pill||'hcfc',r.label]);
  return out;
}
const cardPills=o=>o.st.filter((x,i)=>i===0||['hcfc','pay'].includes(x[0])||String(x[1]).startsWith('Some goods')).filter(x=>!(x[0]==='ok'&&o.st.length>1)).slice(0,3);
const pills = st => st.map(([k,t])=>`<span class="pill p-${k}"><i></i>${esc(t)}</span>`).join(' ');
function search(q, filter='all', limit=60){
  q=(q||'').trim().toLowerCase();
  let rows=S.rows;
  if(filter!=='all') rows=rows.filter(o=>o.st.some(([k])=>k===filter));
  if(!q) return filter==='all'?[]:rows.slice(0,limit);
  const digits=q.replace(/[\s.]/g,'');
  if(/^\d{2,10}$/.test(digits)) return rows.filter(o=>o.k.startsWith(digits)).slice(0,limit);
  const toks=q.split(/\s+/).filter(t=>t.length>1);
  const res=[];
  for(const o of rows){
    if(!toks.every(t=>o.txt.includes(t))) continue;
    let s=0; const d=o.d.toLowerCase(), p=o.p.toLowerCase();
    for(const t of toks){ if(d.includes(t)) s+=5; if(new RegExp('\\b'+t.replace(/[^a-z0-9]/g,'')).test(d)) s+=3; if(p.includes(t)) s+=2; if(o.hd.toLowerCase().includes(t)) s+=1 }
    if(o.grp) s-=2;
    res.push([s,o]);
  }
  res.sort((a,b)=>b[0]-a[0]||a[1].k.localeCompare(b[1].k));
  return res.slice(0,limit).map(x=>x[1]);
}
const codeSeg = c => { const p=c.split('.'); return `<span class="code-seg">${esc(p[0].slice(0,2))}<em>${esc(p[0].slice(2))}</em>${p[1]?'.'+esc(p[1]):''}${p[2]?'<em>.'+esc(p[2])+'</em>':''}</span>` };

function parseRate(s){
  s=String(s||'').trim(); const l=s.toLowerCase();
  if(!s||l==='free'||l==='ex'||l==='-') return {pct:0,spec:0,none:!s};
  const m=l.match(/([\d.]+)\s*%/); const sp=l.match(/rs\.?\s*([\d,]+(?:\.\d+)?)/); const cents=/cents/.test(l);
  return {pct:m?parseFloat(m[1])/100:0, spec:sp?parseFloat(sp[1].replace(/,/g,''))/(cents?100:1):0, perkw:/kw|cm|cc/.test(l)};
}
function estimator(o){
  return `<details class="acc est" open><summary><span class="ic" style="width:34px;height:34px;border-radius:10px;background:var(--sky);color:var(--blue);display:grid;place-items:center;flex:none">${ic('calc')}</span><span class="grow"><b>Duty estimator</b><small>Uses the NITG 2026 levy formulas</small></span><span class="chev">${ic('chev')}</span></summary>
   <div class="in"><form id="estForm" class="grid2" onsubmit="return false">
     <div class="field"><label for="estV">CIF value (LKR)</label><input class="input mono" id="estV" inputmode="decimal" value="1000000"></div>
     <div class="field"><label for="estQ">Quantity (${esc(o.u||'unit')})</label><input class="input mono" id="estQ" inputmode="decimal" value="${isVeh(o)?1:100}"></div>
     ${isVeh(o)?`<div class="field"><label for="estCap">Engine capacity per vehicle (${/kw/i.test(o.exc)?'kW':'cm³'})</label><input class="input mono" id="estCap" inputmode="decimal" placeholder="${/kw/i.test(o.exc)?'e.g. 80':'e.g. 1500'}"></div>
     <div class="field"><label for="estAge">Vehicle age</label><select class="input" id="estAge"><option value="new">Not more than one year old</option><option value="old">More than one year old</option></select></div>`:''}
   </form><div id="estOut"></div></div></details>`;
}

const isVeh=o=>/\|/.test(o.exc||'')||/per\s*(cm|kw)/i.test(o.exc||'');
function vehTier(o,cap,newer){
  const num=s=>parseFloat(String(s).replace(/,/g,''));
  const tiers=String(o.exc||'').split('|').map(s=>s.trim()).filter(Boolean);
  const cand=tiers.map(t=>{
    const r=t.match(/Rs\.?\s*([\d,]+(?:\.\d+)?)\s*\/?-?\s*(?:per\s*)?(cm³|kw|unit)/i);
    let lo=-Infinity,hi=Infinity;
    const m1=t.match(/([\d,]+)\s*(?:cm³|kw)?\s*<\s*x\s*≤\s*([\d,]+)/i);
    if(m1){lo=num(m1[1]);hi=num(m1[2]);}
    else{ const m2=t.match(/([\d,]+)\s*(?:cm³|kw)\s*<\s*=?/i); if(m2) lo=num(m2[1]); const m3=t.match(/x\s*≤\s*([\d,]+)/i); if(m3) hi=num(m3[1]); }
    const age=/not more than one year/i.test(t)?'new':(/for other/i.test(t)?'old':'');
    const pct=(t.match(/^([\d.]+)%$/)||[])[1];
    return {t,rate:r?num(r[1]):null,per:r?r[2].toLowerCase():null,lo,hi,age,pct:pct?parseFloat(pct):null};
  });
  let c2=cand.filter(x=>!(cap>0)||(cap>x.lo&&cap<=x.hi)||(x.lo===-Infinity&&x.hi===Infinity));
  if(cap>0){ const ranged=c2.filter(x=>x.lo!==-Infinity||x.hi!==Infinity); if(ranged.length) c2=ranged; }
  if(c2.some(x=>x.age)) c2=c2.filter(x=>!x.age||x.age===(newer?'new':'old'));
  return c2[0]||null;
}
function tierCell(label,v){
  if(!v||!String(v).includes('|')) return `<div><span>${label}</span><b>${esc(v||'–')}</b></div>`;
  return `<div style="grid-column:1/-1"><span>${label}</span>${String(v).split('|').map(x=>`<b style="display:block;font-size:13.5px">${esc(x.trim())}</b>`).join('')}</div>`;
}
function calcEst(o){
  const v=parseFloat(($('#estV').value||'0').replace(/,/g,''))||0, q=parseFloat(($('#estQ').value||'0').replace(/,/g,''))||0;
  const amt=(r)=>{const p=parseRate(r); if(p.perkw) return {a:v*p.pct,flag:true}; return {a:Math.max(v*p.pct,p.spec*q),spec:p.spec>0}};
  const D=amt(o.gd), C=amt(o.cess), P={a:v*parseRate(o.pal).pct};
  const d=D.a,c=C.a,p=P.a;
  const eBase=v*1.15+d+c+p; const ep=parseRate(o.exc); let e=0, vehNote='';
  if(isVeh(o)){
    const cap=parseFloat((($('#estCap')||{}).value||'').replace(/,/g,'')); const newer=(($('#estAge')||{}).value||'new')==='new';
    const tr=vehTier(o,cap,newer);
    if(!tr) vehNote='No excise tier matches this engine capacity. Check the tariff line.';
    else if(tr.pct!=null){ e=eBase*tr.pct/100; vehNote='Excise tier used: '+tr.t; }
    else if(tr.per==='unit'){ e=tr.rate*q; vehNote='Excise tier used: '+tr.t; }
    else if(tr.rate!=null){ if(cap>0){ e=tr.rate*cap*q; vehNote='Excise tier used: '+tr.t+' × '+cap+' '+(tr.per==='kw'?'kW':'cm³')+' × '+q+' vehicle(s).'; } else vehNote='Enter the engine capacity to calculate excise. Tier: '+tr.t; }
  } else e=ep.perkw?0:Math.max(eBase*ep.pct, ep.spec*q);
  const s=d*parseRate(o.sur).pct;
  const base=v*1.1+d+c+p+e+s; const t=base*parseRate(o.vat).pct; const ss=base*parseRate(o.sscl).pct;
  const tot=d+c+p+e+s+t+ss;
  const f=n=>'Rs '+Math.round(n).toLocaleString('en-LK');
  const flags=[];
  if(D.spec||C.spec) flags.push('Specific rates were compared with ad-valorem rates using the quantity; the higher amount is used.');
  if(vehNote) flags.push(vehNote);
  let sclRow='';
  if(o.sclr){ const sr=parseRate(o.sclr); const sv=Math.max(v*sr.pct, sr.spec*q); sclRow=`<tr class="tot"><td>SCL at ${esc(o.sclr)}</td><td>${f(sv)}</td></tr>`; flags.push('SCL (chart 05.05.2026, valid until '+o.sclv+') is a composite levy in lieu of customs duty, VAT, CESS, excise and PAL. While it is in force, the SCL amount applies instead of the levies above.'); }
  else if(o.scl) flags.push('A Special Commodity Levy applies to this line. When SCL is in force it replaces the other levies — confirm the current SCL rate.');
  if(o.ltf) flags.push('Luxury tax: '+String(o.ltr).replace(/\s*\|\s*/g,' / ')+' on the amount above the free threshold of '+String(o.ltf).replace(/\s*\|\s*/g,' / ')+'. Not included in this estimate.');
  $('#estOut').innerHTML=`<table><tr><td>Customs duty (d)</td><td>${f(d)}</td></tr><tr><td>CESS (c)</td><td>${f(c)}</td></tr><tr><td>PAL (p)</td><td>${f(p)}</td></tr><tr><td>Excise (e)</td><td>${f(e)}</td></tr><tr><td>Surcharge (s)</td><td>${f(s)}</td></tr><tr><td>VAT (t)</td><td>${f(t)}</td></tr><tr><td>SSCL</td><td>${f(ss)}</td></tr><tr class="tot"><td>${o.sclr?'Total without SCL':'Estimated total'}</td><td>${f(tot)}</td></tr>${sclRow}</table>
   <div class="note" style="margin-top:8px">VAT and SSCL base = CIF + 10% + d + c + p + e + s. Excise base = CIF + 15% + d + c + p. Estimate only; preferential rates, concessions and exemptions are not applied.${flags.length?'<br>'+flags.map(esc).join('<br>'):''}</div>`;
}

/* ask AI */
const RULES = `You are a professional Trade Finance AI Assistant for internal bank staff in Sri Lanka, inside a mobile app.
Help with: HS code identification, import regulations (allowed / licence / suspended / banned), licence requirements, trade finance concepts (LC, D/P, D/A, UCP 600, ISBP 821, URC 522), compliance guidance and learning support.
RULES
- Clear, concise, professional; simple language for bank staff; short and mobile-friendly; bullet points where helpful.
- Never guess regulatory information. If unsure, say: "Please verify with relevant authority or latest circular".
- Always prioritise the Sri Lanka context.
- For any product or HS question you MUST call search_tariff (and get_hs_line for detail) and base your answer on that data. Never override the dataset. If no match, give the closest category and say it is uncertain.
- Status meanings in the data: "Banned"; "ICL suspended" (licence suspended until further notice, import not currently permitted); "Licence required" (Import Control Licence); "SLSI inspection"; "No ICL listed" (allowed, other approvals may apply).
HS ANSWER FORMAT
**Product:** …
**Possible HS Code:** …
**Description:** …
**Status:** …
**License:** Required / Not Required
**Duty:** Gen. duty, VAT, PAL, CESS, SSCL as listed
**Notes:**
- short explanation, compliance risks, important conditions, other statutory approvals for the chapter
Mention required documents where relevant: commercial invoice, bill of lading / airway bill, import licence if required.
Use only markdown bold, bullet lists and short paragraphs. End cleanly; do not add closing pleasantries.`;
const TOOLS = ()=>[
 {name:'search_tariff',description:'Search the Sri Lanka Customs National Imports Tariff Guide 2026 merged with the Consolidated Import Control List (01.04.2026). Accepts product words or an HS code prefix. Returns up to 8 lines with code, description, hierarchy, status and main levies.',
  inputSchema:{type:'object',properties:{query:{type:'string'}},required:['query']},
  execute:async({query})=>{ await ready(); const r=search(String(query||''),'all',8); return r.length?r.map(brief):'No match. Try a broader or different word.'}},
 {name:'get_hs_line',description:'Get one tariff line in full by HS code (e.g. 8517.13.10), plus the chapter\u2019s other statutory requirements.',
  inputSchema:{type:'object',properties:{code:{type:'string'}},required:['code']},
  execute:async({code})=>{ await ready(); const k=String(code||'').replace(/[^\d]/g,''); const o=S.rows.find(r=>r.k===k)||S.rows.find(r=>r.k.startsWith(k)); if(!o) throw new Error('Code not found'); const st=S.data.stat[o.c.slice(0,2)]; return {...brief(o),excise:o.exc,surcharge:o.sur,unit:o.u,icl_column:o.icl,consolidated_icl:o.ctl||(o.rel?('related entry '+o.rel+': '+S.data.icl[o.rel].join(' - ')):'none'),statutory:st?st.r.slice(0,1800):'none listed',source_page:o.pg} }}
];
const brief=o=>({code:o.c,description:o.d,hierarchy:(o.hd?o.hd.slice(0,120)+' > ':'')+o.p,status:o.grp?'group heading (see sub-lines)':o.st.map(s=>s[1]).join(', '),gen_duty:o.gd,vat:o.vat,pal:o.pal,cess:o.cess,sscl:o.sscl,scl:o.scl});
function ready(){ return new Promise(r=>{ const t=()=>S.loading?setTimeout(t,200):r(); t() }) }
function md(t){
  const lines=esc(t).split('\n'); let h='',inl=false;
  const fmt=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  for(let l of lines){
    if(/^\s*[-*•]\s+/.test(l)){ if(!inl){h+='<ul>';inl=true} h+='<li>'+fmt(l.replace(/^\s*[-*•]\s+/,''))+'</li>'; continue }
    if(inl){h+='</ul>';inl=false}
    if(/^#{1,4}\s/.test(l)) h+='<h4>'+fmt(l.replace(/^#+\s/,''))+'</h4>';
    else if(l.trim()) h+='<p>'+fmt(l)+'</p>';
  }
  if(inl) h+='</ul>'; return h;
}
function vAsk(){
  const sugg=['Can I import used smartphones?','HS code and duty for solar panels','Difference between D/P and D/A','What does UCP 600 Article 14 say?','Is palm oil allowed for import?','Common LC discrepancies'];
  return `
  <section class="stack"><div><div class="eyebrow">Trade Assistant</div><h1 style="font-size:22px;margin-top:4px">Ask about HS codes, licences and LCs</h1></div>
  ${S.sample===null&&window.claude?'':''}
  ${!S.chat.length?`<div class="card stack"><div class="small muted">Answers use the tariff data in this app. Each answer runs on your own Claude account; the first question asks you to allow it.</div><div class="qa">${sugg.map(s=>`<button data-askq="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`:''}
  <div class="chat" id="chatlog">${S.chat.map(m=>`<div class="msg ${m.role==='user'?'me':'ai'}">${m.role==='user'?esc(m.content):(m.pending&&!m.content?'<span class="typing"><i></i><i></i><i></i></span>':md(m.content))}</div>`).join('')}</div>
  ${S.chat.length?`<div class="row"><button class="btn line sm" data-clearchat>New chat</button></div>`:''}
  </section>
  <form class="composer" id="askForm"><textarea class="input" id="askQ" rows="1" placeholder="${S.sample===null&&S.tried?'Assistant is not available in this view':'Type your question…'}" aria-label="Your question"></textarea>
   ${S.chatBusy?`<button type="button" class="btn line" data-stop>Stop</button>`:`<button class="btn" type="submit" aria-label="Send">${ic('chat')}</button>`}</form>`;
}
async function ask(q){
  q=(q||'').trim(); if(!q||S.chatBusy) return;
  if(!S.sample){ S.tried=true; toast('The assistant works when this app is opened in Claude.'); render(); return }
  S.chat.push({role:'user',content:q}); const a={role:'assistant',content:'',pending:true}; S.chat.push(a);
  S.chatBusy=true; S.ctl=new AbortController(); go('ask');
  const turns=[{role:'user',content:RULES},{role:'assistant',content:'Understood. I will follow these rules and use the tariff tools for product questions.'},...S.chat.filter(m=>m!==a&&!m.err).slice(-8).map(m=>({role:m.role,content:m.content}))];
  const paint=()=>{const n=$$('#chatlog .msg.ai').pop(); if(n) n.innerHTML=md(a.content)};
  try{
    const res=await S.sample(turns,{signal:S.ctl.signal,tools:TOOLS(),modelTier:'default',onText:({text})=>{a.content=text;paint()}});
    a.content=res.text;
  }catch(e){
    a.content=(e.text||'')+(e.code==='cancelled'?'':'\n\n'+({not_granted:'The assistant was not allowed for this app.',rate_limited:'Too many questions right now — please try again shortly.',refused:'That question could not be answered. Try rephrasing it.',tools_unavailable:'This view cannot use the tariff tools.'}[e.code]||'The answer was interrupted. Please try again.'));
    if(!e.text&&e.code!=='cancelled') a.err=true;
  }
  a.pending=false; S.chatBusy=false; render(); window.scrollTo(0,document.body.scrollHeight);
}

function srcOf(v){ return v.kind==='upload'?'Video':v.kind==='youtube'?'YouTube':v.kind==='drive'?'Google Drive':'Link' }
function vCard(v){
  const playing=S.playing===v.id&&v.kind==='upload'&&v.asset;
  const ext=v.kind!=='upload';
  const inner=`<span class="src">${srcOf(v)}</span><span class="big">${esc((v.cat||'').split(' ')[0])}</span><span class="play">${ic('play')}</span>${v.dur?`<span class="dur">${esc(v.dur)}</span>`:''}`;
  return `<article class="vcard">
   ${playing?`<div class="thumb"><video src="/_blob/${esc(v.asset)}" controls autoplay playsinline></video></div>`
    :ext&&v.url?`<a class="thumb" href="${esc(v.url)}" target="_blank" rel="noopener" data-watch="${esc(v.id)}">${inner}</a>`
    :`<button class="thumb" data-play="${esc(v.id)}" aria-label="Play ${esc(v.title)}">${inner}</button>`}
   <div class="vbody"><span class="eyebrow">${esc(v.cat||'')}</span><b>${esc(v.title)}</b>${v.desc?`<span class="small muted">${esc(v.desc)}</span>`:''}
    <div class="row" style="margin-top:auto;justify-content:space-between">${S.progress[v.id]?`<span class="done">${ic('check')}Watched</span>`:`<button class="btn line sm" data-markwatch="${esc(v.id)}" ${S.uid?'':'hidden'}>Mark as watched</button>`}${ext?`<span class="small muted"><span class="pill p-warn" style="padding:1px 7px;font-size:10.5px;vertical-align:1px"><i></i>Internet</span> Opens in a new tab</span>`:''}</div></div>
  </article>`;
}

  S.engBusy=true; S.engOut=''; render();

Reply in this exact format, short:

document.addEventListener('click',e=>{ const t=e.target.closest('button'); if(!t) return; const d=t.dataset;

  if(d.cedit) return openContact(d.cedit);
  if(d.cdel){ LS.set('contacts',getContacts().filter(x=>x.id!==d.cdel)); closeSheet(); toast('Contact deleted'); return render() }
});
document.addEventListener('submit',e=>{ if(e.target.id!=='contactForm') return; e.preventDefault();
  const v=id=>$('#'+id).value.trim(); if(!v('ctName')) return toast('Add a name.');
  const id=e.target.dataset.id||('c'+Date.now().toString(36)); const c={id,name:v('ctName'),org:v('ctOrg'),role:v('ctRole'),phone:v('ctPhone'),email:v('ctEmail'),note:v('ctNote')};
  const all=getContacts().filter(x=>x.id!==id); all.push(c); LS.set('contacts',all); closeSheet(); toast('Saved'); render();
});

async function saveMedia(form){
  const col=form.dataset.col, isV=col==='videos', btn=$('#mSave');

  const prev=S.edit&&S.edit.col===col?S.edit.doc:null;
  const doc={title:$('#mTitle').value.trim(),dur:$('#mDur').value.trim(),desc:$('#mDesc').value.trim(),kind,order:$('#mOrder').value?Number($('#mOrder').value):null,updated:Date.now()};
  if(isV) doc.cat=$('#mCat').value; else doc.level=$('#mCat').value.trim();
  if(!doc.title) return toast('Add a title first.');

      if(!S.assets) return toast('Uploading needs editor access in Claude.');

async function drawPdf(){
  const w=$('#pvWrap'); if(!w||!PV.doc||PV.busy) return; PV.busy=true;
  try{
    const p=await PV.doc.getPage(PV.page); const base=p.getViewport({scale:1});
    const fit=(w.clientWidth-24)/base.width; const scale=Math.max(.3,fit*PV.zoom); const dpr=Math.min(window.devicePixelRatio||1,2.5);
    const vp=p.getViewport({scale:scale*dpr}); const cv=document.createElement('canvas');
    cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height); cv.style.width=Math.floor(vp.width/dpr)+'px'; cv.style.height=Math.floor(vp.height/dpr)+'px';
    await p.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    if(!$('#pvWrap')) return; w.innerHTML=''; w.appendChild(cv); w.scrollTop=0;
    const pg=$('#pvPg'); if(pg) pg.textContent=PV.page+' / '+PV.doc.numPages;
  }catch(e){ w.innerHTML='<div class="pdfmsg">This page could not be drawn.</div>' }
  PV.busy=false;
}

async function submitReport(){
  const r={code:$('#rCode').value.trim(),type:$('#rType').value,details:$('#rDet').value.trim(),source:$('#rSrc').value.trim(),name:$('#rName').value.trim(),at:Date.now(),status:'open'};

const FATF_BLACK=['North Korea (DPRK)','Iran','Myanmar'];
const FATF_GREY=['Angola','Bolivia','Bosnia and Herzegovina','Bulgaria','Cameroon',"Côte d'Ivoire",'DR Congo','Haiti','Iraq','Kenya','Kuwait','Lao PDR','Lebanon','Monaco','Nepal','Papua New Guinea','South Sudan','Syria','Venezuela','Vietnam','British Virgin Islands','Yemen'];
const EMBARGO=['Cuba','Iran','North Korea (DPRK)','Crimea','Donetsk (so-called DNR)','Luhansk (so-called LNR)'];
const SECTORAL=['Russia','Belarus','Syria (residual)','Venezuela','Myanmar'];
const UN_REG=['North Korea (DPRK)','Iran','Libya','Somalia','South Sudan','Sudan','Central African Republic','DR Congo','Yemen','Iraq','Lebanon','Haiti','Afghanistan (Taliban list)'];
const ALIAS={'dprk':'north korea','korea, north':'north korea','drc':'dr congo','congo':'dr congo','bvi':'british virgin islands','virgin islands':'british virgin islands','burma':'myanmar','laos':'lao pdr','ivory coast':"côte d'ivoire",'cote d\'ivoire':"côte d'ivoire",'bosnia':'bosnia and herzegovina','car':'central african republic','afghanistan':'afghanistan (taliban list)','ukraine':'crimea'};
function countryResult(q){
  q=(q||'').trim().toLowerCase(); if(q.length<3) return '';
  const k=ALIAS[q]||q; const hit=(arr)=>arr.filter(x=>x.toLowerCase().includes(k)||k.includes(x.toLowerCase().replace(/\s*\(.*\)/,'')));
  const r=[]; if(hit(FATF_BLACK).length) r.push(['bad','FATF call for action (black list) — enhanced due diligence and countermeasures']);
  if(hit(EMBARGO).length) r.push(['bad','Comprehensive embargo by US / EU / UK — payments through correspondent banks will be blocked']);
  if(hit(UN_REG).length) r.push(['bad','UN Security Council sanctions regime — binding in Sri Lanka']);
  if(hit(SECTORAL).length) r.push(['warn','Targeted or sectoral sanctions (US / EU / UK) — goods, parties or banks may be restricted']);
  if(hit(FATF_GREY).length) r.push(['warn','FATF increased monitoring (grey list) — apply enhanced due diligence']);
  if(k==='ukraine') r.push(['warn','Occupied regions of Ukraine are under comprehensive sanctions — check the exact port or city']);
  const cls=r.some(x=>x[0]==='bad')?'bad':r.length?'warn':'ok';
  return `<div class="result ${cls}">${r.length?r.map(x=>`<div>• ${esc(x[1])}</div>`).join(''):`<div><b>Not on the lists in this app.</b> Still screen every party, bank, vessel and port in the bank's screening system.</div>`}</div>`;
}
function imoValid(s){ if(!/^\d{7}$/.test(s)) return false; const d=s.split('').map(Number); return d.slice(0,6).reduce((t,x,i)=>t+x*(7-i),0)%10===d[6] }
function vesselLinks(L){ return `<div class="linkgrid">${L.map(([l,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${ic('ext')}${esc(l)}</a>`).join('')}</div>` }
function vesselResult(raw){
  raw=String(raw||'').trim(); if(!raw) return '';
  const m=raw.match(/(?:^|\D)(\d{7})(?!\d)/); const name=raw.replace(/\bIMO\b[:\s]*\d*|\d{7}/gi,'').replace(/[()\[\],;:]+/g,' ').replace(/\s+/g,' ').trim();
  const out=[];
  if(m){
    const s=m[1];
    if(!imoValid(s)) out.push(`<div class="result bad"><b>${esc(s)} is not a valid IMO number.</b><div>An IMO number has 7 digits and a check digit. A wrong IMO on a bill of lading is itself a red flag — ask the shipping line for the vessel's IMO.</div></div>`);
    else out.push(`<div class="result ok"><b>IMO ${esc(s)} — check digit is valid.</b><div>Check its position history, flag, owner and sanctions status${name?` and confirm the name matches “${esc(name)}”`:''}:</div></div>`+vesselLinks([['MarineTraffic','https://www.marinetraffic.com/en/ais/details/ships/imo:'+s],['VesselFinder','https://www.vesselfinder.com/vessels/details/'+s],['OpenSanctions','https://www.opensanctions.org/search/?q='+s],['Equasis (login)','https://www.equasis.org/'],['OFAC search','https://sanctionssearch.ofac.treas.gov/'],['UN consolidated list','https://main.un.org/securitycouncil/en/content/un-sc-consolidated-list']]));
  }
  if(name.length>=3&&!/^\d+$/.test(name)){

async function saveCirc(){
  const prev=S.edit&&S.edit.col==='circulars'?S.edit.doc:null; const v=id=>$('#'+id).value.trim(); const btn=$('#cSave');
  const doc={title:v('cTitle'),issuer:v('cIssuer'),ref:v('cRef'),date:v('cDate'),cat:v('cCat'),summary:v('cSum'),codes:v('cCodes'),kind:v('cKind'),updated:Date.now()};
  if(!doc.title) return toast('Add a title first.');
  if(doc.kind==='upload'){
    const f=$('#cFile').files[0];
    if(f){ if(f.size>20*1024*1024) return toast('This PDF is over 20 MB. Use a link instead.'); if(!S.assets) return toast('Uploading needs editor access.');
      btn.disabled=true; btn.textContent='Uploading…';
      try{ const r=await S.assets.upload(f,{type:'application/pdf'}); doc.asset=r.id }catch(e){ btn.disabled=false; btn.textContent='Add circular'; return toast(e.code==='too_large'?'File too large (20 MB max).':e.code==='unsupported_type'?'Choose a PDF file.':e.code==='quota_or_state'?'Storage is full. Remove old uploads first.':'Upload failed. Please try again.') }
    } else if(prev&&prev.asset) doc.asset=prev.asset; else return toast('Choose a PDF file.');
    doc.url='';
  } else { if(!/^https?:\/\//.test(v('cUrl'))) return toast('Paste a full link starting with https://'); doc.url=v('cUrl'); doc.asset=null }
  try{
    if(prev){ await S.db.doc('circulars/'+prev.id).set(clean({...prev,...doc,own:undefined})); if(prev.asset&&doc.asset!==prev.asset&&S.assets) S.assets.delete(prev.asset).catch(()=>{}) }
    else await S.db.collection('circulars').add({...doc,created:Date.now()});
    S.edit=null; toast(prev?'Saved':'Circular added'); render();
  }catch(e){ if(btn){btn.disabled=false;btn.textContent='Add circular'} toast('Could not save. Check your access and try again.') }
}

function calcPrice(){
  const f=$('#pcForm'); const out=$('#pcOut'); if(!f||!out) return;
  const o=S.rows.find(r=>r.c===f.dataset.hs); const sel=WP.find(b=>b.id===S.wpSel); if(!o||!sel) return;
  S.wpP=$('#pcP').value; S.wpU=$('#pcU').value; S.wpC=$('#pcC').value; S.wpR=$('#pcR').value; S.wpI=$('#pcI').value; S.wpQ=$('#pcQ').value; S.wpO=$('#pcO').value;
  $('#pcRF').hidden=S.wpC==='USD'; $('#pcRC').textContent=S.wpC;
  const p=parseFloat(String(S.wpP).replace(/,/g,'')); if(!(p>0)){ out.innerHTML=S.wpO&&S.wpO.trim().length>=3?`<div class="small"><b>Origin check · ${esc(S.wpO)}</b></div>${countryResult(S.wpO)}`:''; return }
  const rate=S.wpC==='USD'?1:parseFloat(String(S.wpR).replace(/,/g,''));
  if(!(rate>0)){ out.innerHTML=`<div class="result warn">Enter the bank's rate for 1 ${esc(S.wpC)} in USD to compare.</div>`; return }
  const kind=wpKind(sel.unit); const uz=(WP_UNITS[kind].find(u=>u[0]===S.wpU)||WP_UNITS[kind][0])[2];
  const usdPerBase=p*rate/uz; const inv=usdPerBase*wpBase(sel.unit);   // invoice in benchmark unit
  const last=sel.v[10], lo=Math.min(...sel.v.slice(3)), hi=Math.max(...sel.v.slice(3));
  const d=inv/last-1, ad=Math.abs(d), dir=d>0?'above':'below';
  const fob=/f\.o\.b|fob|export price|gulf export/i.test(sel.basis), cfr=/c\.?f\.?r|cif|c\.i\.f|C\/F|CFR/i.test(sel.basis);
  const invC=['CFR','CIF','CIP','DAP'].includes(S.wpI);
  const fr=fob&&invC?0.12:(cfr&&!invC?-0.08:0);  // rough freight allowance
  const da=(inv/(last*(1+fr)))-1, aa=Math.abs(da);
  const lvl=aa<=0.2?'ok':aa<=0.4?'warn':'bad';
  const head={ok:'In line with the world price',warn:`${Math.round(aa*100)}% ${dir} the world price — ask for an explanation`,bad:`${Math.round(aa*100)}% ${dir} the world price — possible ${d>0?'over':'under'}-invoicing`}[lvl];
  const act={ok:'No price concern. Continue with the normal document checks.',warn:'Ask the customer to explain the price (grade, origin, freight, contract date, lot size) and keep the reply on file.',bad:'Treat as a trade-based money laundering red flag: get a written explanation and supporting evidence, and escalate to your supervisor / Compliance before processing.'}[lvl];
  const mn=Math.min(inv,lo,last*0.6), mx=Math.max(inv,hi,last*1.4); const pos=x=>Math.max(0,Math.min(100,(x-mn)/(mx-mn)*100));
  const unitTxt=sel.unit.replace('$/','per ');
  const q=parseFloat(String(S.wpQ).replace(/,/g,''));
  const gap=q>0?Math.abs(p*rate - last*(1+fr)/wpBase(sel.unit)*uz)*q:0;
  S.wpText=`World price check — HS ${o.c} (${o.d})\nBenchmark: ${sel.name}, ${WP_SRC.month}: $${nf(last)} ${unitTxt} (${sel.basis})\nInvoice: ${S.wpC} ${S.wpP} ${(WP_UNITS[kind].find(u=>u[0]===S.wpU)||[])[1]||''}, ${S.wpI}${S.wpC!=='USD'?' @ '+S.wpR+' USD':''} = $${nf(inv)} ${unitTxt}\nVariance: ${d>=0?'+':''}${Math.round(d*100)}% vs benchmark${fr?` (${Math.round(da*100)}% after a ${Math.round(Math.abs(fr)*100)}% freight allowance)`:''}\nResult: ${head}${S.wpO?'\nOrigin: '+S.wpO:''}\nChecked: ${new Date().toLocaleString('en-GB')} · Source: ${WP_SRC.title}`;
  out.innerHTML=`<div class="result ${lvl}"><b>${esc(head)}</b><div>Invoice = <b class="mono">$${nf(inv)}</b> ${esc(unitTxt)} vs benchmark <b class="mono">$${nf(last)}</b> (${d>=0?'+':''}${Math.round(d*100)}%)${fr?` · ${fr>0?'+':''}${Math.round(fr*100)}% freight allowance applied for ${esc(S.wpI)} vs a ${fob?'f.o.b.':'delivered'} benchmark`:''}.</div>${gap>0&&lvl!=='ok'?`<div>Difference on this quantity ≈ <b class="mono">USD ${nf(gap,0)}</b>.</div>`:''}<div>${esc(act)}</div></div>
   ${S.wpO&&S.wpO.trim().length>=3?`<div class="small"><b>Origin check · ${esc(S.wpO)}</b></div>${countryResult(S.wpO)}`:''}
   <div class="wpscale" aria-hidden="true"><div class="band" style="left:${pos(last*(1+fr)*0.8)}%;width:${pos(last*(1+fr)*1.2)-pos(last*(1+fr)*0.8)}%"></div><div class="rng" style="left:${pos(lo)}%;width:${Math.max(1,pos(hi)-pos(lo))}%"></div><i class="bm" style="left:${pos(last)}%"></i><i class="iv ${lvl}" style="left:${pos(inv)}%"></i></div>
   <div class="wplegend small muted"><span><i class="k band"></i>±20% normal zone</span><span><i class="k rng"></i>12-month range</span><span><i class="k bm"></i>Benchmark</span><span><i class="k iv"></i>Invoice</span></div>
   <div class="row"><button class="btn sm line" data-copywp>${ic('copy')}Copy result for the file</button>${lvl!=='ok'?`<button class="btn sm ghost" data-go="sanc">TBML red flags</button>`:''}</div>`;
}

  if(PRICES) return Promise.resolve(PRICES);
  if(window.PRICEDATA){ PRICES=window.PRICEDATA; return Promise.resolve(PRICES) }
  if(!PRICES_P) PRICES_P=fetch('prices.json').then(r=>r.json()).then(j=>(PRICES=j)).catch(()=>{PRICES_P=null; return null});
  return PRICES_P;
}

const PC={hs:'',origin:'',val:'',cur:'USD',rate:'',qty:'',kg:'',kgu:'kg',term:'CIF'};
const WU=[['kg','kg',1],['MT','MT (metric tonne)',1000],['g','g (gram)',0.001],['lb','lb (pound)',0.45359237],['LT','Long ton (2,240 lb)',1016.047],['ST','Short ton (2,000 lb)',907.185]];
const fmtU=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:0}):v>=1?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toPrecision(3);
function priceFor(hs){ const k=String(hs||'').replace(/\D/g,'').slice(0,6); return k.length===6&&PRICES?{k,e:PRICES.c[k]}:{k,e:null} }

   <ul class="ticks risks"><li>An HS code covers many grades, brands and specifications, so a price outside the usual range is a <b>reason to ask questions</b>, not proof of fraud.</li>
