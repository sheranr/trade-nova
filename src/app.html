function num(v){ return parseFloat(String(v||'').replace(/,/g,''))||0 }
function band(label,unit,mine,b,orig,oname){
  const [med,p10,p90,n]=b; const lo=Math.min(p10,mine,orig||Infinity)/1.6, hi=Math.max(p90,mine,orig||0)*1.6;
  const L=Math.log(lo), R=Math.log(hi), x=v=>((Math.log(v)-L)/(R-L)*100).toFixed(1)+'%';
  const r=mine/med; let cls='ok',verdict='Within the usual range',why='';
  if(mine>p90*1.25||r>2){cls='bad';verdict='Much higher than usual — possible over-invoicing'}
  else if(mine>p90||r>1.5){cls='warn';verdict='Higher than usual'}
  else if(mine<p10/1.25||r<.5){cls='bad';verdict='Much lower than usual — possible under-invoicing'}
  else if(mine<p10||r<.67){cls='warn';verdict='Lower than usual'}
  const pct=Math.round((r-1)*100);
  return `<div class="card stack"><div class="sec-h"><h2>Price per ${esc(unit)}</h2><span class="pill p-${cls==='bad'?'bad':cls==='warn'?'warn':'ok'}"><i></i>${pct>=0?'+':''}${pct}% vs median</span></div>
   ${n<6?`<div class="note">Limited data: only ${n} shipment-years behind this range, so treat the result with extra care.</div>`:''}<div class="result ${cls}"><b>${verdict}</b><div>Invoice: <b>USD ${fmtU(mine)}</b> per ${esc(unit)} · usual range USD ${fmtU(p10)} – ${fmtU(p90)} · median USD ${fmtU(med)}</div></div>
   <div class="pband" role="img" aria-label="Invoice price compared with the usual range">
    <span class="pb-range" style="left:${x(p10)};width:calc(${x(p90)} - ${x(p10)})"></span><span class="pb-med" style="left:${x(med)}"></span>
    ${orig?`<span class="pb-orig" style="left:${x(orig)}" title="${esc(oname)}"></span>`:''}<span class="pb-me ${cls}" style="left:${x(mine)}"></span></div>
   <div class="pb-leg small muted"><span><i class="lg-range"></i>Usual range (10th–90th percentile, ${n} shipment-years)</span><span><i class="lg-med"></i>Median</span>${orig?`<span><i class="lg-orig"></i>${esc(oname)} average USD ${fmtU(orig)}</span>`:''}<span><i class="lg-me ${cls}"></i>This invoice</span></div>
  </div>`;
}
function priceResult(){
  if(!PRICES) return `<div class="empty"><b>Loading price data…</b></div>`;
  const {k,e}=priceFor(PC.hs);
  if(k.length<6) return `<div class="empty">${ic('calc')}<b>Enter a 6-digit HS code to start</b><span class="small">Then the invoice value and quantity or weight.</span></div>`;
  if(!e) return `<div class="empty"><b>No price data for HS ${esc(k.slice(0,4)+'.'+k.slice(4))}</b><span class="small">Sri Lanka recorded no imports of this code above USD 3,000 in ${PRICES.meta.years.join(', ')}. Use a market quotation or earlier invoices instead.</span></div>`;
  const usd=num(PC.val)*(PC.cur==='USD'?1:num(PC.rate)); const q=num(PC.qty), kg=num(PC.kg)*((WU.find(w=>w[0]===PC.kgu)||WU[0])[2]);
  const adj={FOB:1.08,FCA:1.08,EXW:1.1,CFR:1.01,CPT:1.01}[PC.term]||1;
  const UN=e.un==='u'?'unit':e.un; const P=PRICES.p, o=PC.origin&&e.o[PC.origin], oname=PC.origin?(P[PC.origin]||'Origin'):'';
  const out=[];
  const info=`<div class="card small stack"><div><b>Sri Lanka imports of HS ${esc(k.slice(0,4)+'.'+k.slice(4))}</b> · ${Object.keys(e.o).length} origin countries · ${e.y.join(', ')}</div>
    ${PC.origin?(o?`<div>${esc(oname)}: USD ${Math.round(o[0]).toLocaleString('en-US')} imported${o[1]?` · average USD ${fmtU(o[1])}/kg`:''}${o[2]?` · USD ${fmtU(o[2])}/${esc(e.un)}`:''} (latest ${o[3]})</div>`:`<div class="watchhit">Sri Lanka recorded no imports of this code from ${esc(oname)} in these years. Ask why this route is used.</div>`):''}</div>`;
  if(!usd) return info+`<div class="empty"><b>Add the invoice value${PC.cur!=='USD'?' and the rate to USD':''}</b></div>`;
  if(!q&&!kg) return info+`<div class="empty"><b>Add the quantity or the net weight</b></div>`;
  const cif=usd*adj;
  if(e.u&&q) out.push(band('unit',UN,cif/q,e.u,o&&o[2],oname));
  if(e.k&&kg){ if(PC.kgu!=='kg') out.push(`<div class="note">${esc(PC.kg)} ${esc(PC.kgu)} = ${kg.toLocaleString('en-US',{maximumFractionDigits:2})} kg</div>`); out.push(band('kg','kg',cif/kg,e.k,o&&o[1],oname)); }
  if(!out.length) out.push(`<div class="empty"><b>Price data for this code is ${e.k?'per kg':'per '+esc(e.un)}</b><span class="small">Enter the ${e.k?'net weight in kg':'quantity in '+esc(e.un)} to compare.</span></div>`);
  return info+(adj!==1?`<div class="note">The ${esc(PC.term)} value was raised by ${Math.round((adj-1)*100)}% to approximate CIF, because the benchmarks are CIF.</div>`:'')+out.join('')+
   `<div class="row">${S.sample?`<button class="btn ghost sm" data-askq="${esc(`An import invoice for HS ${k} from ${oname||'an unknown origin'}: value USD ${Math.round(usd)} ${PC.term}, quantity ${q||'-'}, net weight ${kg||'-'} kg. Explain in plain words what legitimate reasons could explain a price outside the usual range for this kind of goods, and what documents the officer should ask for.`)}">${ic('spark')}Ask AI what to check</button>`:''}<button class="btn sm line" data-go="sanc">TBML red flags</button></div>`;
}

const normB=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\b(bank|banco|public|joint|stock|company|pjsc|jsc|ojsc|ao|pao|cjsc|ltd|limited|of|the|and)\b/g,' ').replace(/[^a-z0-9]+/g,' ').trim();
function bankResult(raw){
  raw=String(raw||'').trim(); if(raw.length<3) return '';
  const out=[]; const up=raw.toUpperCase().replace(/\s+/g,'');
  const bic=/^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$/.test(up)?up:null;
  let name=raw;
  if(bic){
    const cc=bic.slice(4,6), cn=BIC_CC[cc];
    out.push(`<div class="result ${cn&&countryResult(cn).includes('result bad')?'bad':cn&&countryResult(cn).includes('result warn')?'warn':'ok'}"><b>SWIFT / BIC ${esc(bic)}</b><div>Bank code ${esc(bic.slice(0,4))} · country <b>${esc(cc)}${cn?' ('+esc(cn)+')':''}</b> · location ${esc(bic.slice(6,8))}${bic.length===11?' · branch '+esc(bic.slice(8)):''}</div></div>`);
    const sb=SBIC[bic.slice(0,6)]; if(sb) out.push(`<div class="result bad"><b>${esc(bic.slice(0,6))} is the SWIFT code of ${esc(sb)} — a sanctioned bank.</b><div>Stop and refer to Compliance.</div></div>`);
    if(cn) out.push(countryResult(cn));
    name=bic.slice(0,4);
  } else if(/^[A-Z0-9]{8}([A-Z0-9]{3})?$/i.test(up)&&/\d/.test(up.slice(0,6))) out.push(`<div class="result warn">This does not look like a valid SWIFT / BIC (4 letters bank code + 2 letters country + 2 location + optional 3 branch).</div>`);
  if(!bic){
    const q=normB(raw); const hits=[];
    if(q.length>=3) for(const [c,rule,list] of SBANKS) for(const b of list){ const n=normB(b); const ws=q.split(' ').filter(w=>w.length>2); if(n&&(n.includes(q)||(n.length>=4&&q.includes(n))||(ws.length&&ws.every(w=>n.split(' ').includes(w))))) hits.push([c,b,rule]); }
    if(hits.length) out.push(`<div class="result bad"><b>Possible match on the sanctioned banks list</b>${hits.slice(0,6).map(([c,b])=>`<div>• ${esc(b)} — ${esc(c)}</div>`).join('')}<div>Stop and refer to Compliance. Confirm in the live lists below — a similar name is not always the same bank.</div></div>`);
    else out.push(`<div class="result ok"><b>No match in the quick list in this app.</b><div>That does not clear the bank. Check the live lists below, which are updated daily.</div></div>`);
  }
  const q=encodeURIComponent(raw);
  out.push(`<div class="linkgrid">${[['OpenSanctions (all lists)','https://www.opensanctions.org/search/?q='+q],['OFAC sanctions search','https://sanctionssearch.ofac.treas.gov/'],['EU sanctions map','https://www.sanctionsmap.eu/'],['UK sanctions list','https://www.gov.uk/government/publications/the-uk-sanctions-list'],['UN consolidated list','https://main.un.org/securitycouncil/en/content/un-sc-consolidated-list'],['FATF high-risk countries','https://www.fatf-gafi.org/en/countries/black-and-grey-lists.html']].map(([l,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${ic('ext')}${esc(l)}</a>`).join('')}</div>`);
  return out.join('');
}

const b64u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sha256hex(text){ const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('') }
async function verifySig(payload,sig){
  const key=await crypto.subtle.importKey('spki',b64u8(OTA_PUBKEY),{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
  return crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,b64u8(sig),new TextEncoder().encode(payload));
}

  const db=await idb(); const m={...meta,files:{}};
  await new Promise((res,rej)=>{ const t=db.transaction('c','readwrite'); const os=t.objectStore('c'); os.clear();
    for(const [n,txt] of Object.entries(files)){ const k=Math.max(1,Math.ceil(txt.length/OTA_CHUNK)); m.files[n]={chunks:k,sha256:meta.sha[n]}; for(let i=0;i<k;i++) os.put(txt.slice(i*OTA_CHUNK,(i+1)*OTA_CHUNK),'f:'+n+':'+i) }
    delete m.sha; os.put(m,'meta'); t.oncomplete=res; t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error) });
}
function builtinFiles(){ try{ return JSON.parse(localStorage.getItem('tn-builtin'))||{} }catch(e){ return {} } }
function otaBanner(){
  let el=$('#otaBar'); if(!el){ el=document.createElement('div'); el.id='otaBar'; el.className='otabar'; document.body.appendChild(el) }
  if(OTA.apk) el.innerHTML=`<span>${ic('upload')}<b>New app version ${esc(OTA.apk.version)}</b> ${OTA.apk.required?'— required to keep receiving updates':'is available'}</span><button class="btn sm" data-otaapk>Download</button><button class="x" data-otaclose aria-label="Later">${ic('x')}</button>`;
  else if(OTA.ready) el.innerHTML=`<span>${ic('check',2.4)}<b>Update ${esc(OTA.ready)} is ready.</b> ${esc(OTA.notes||'')}</span><button class="btn sm" data-otarestart>Restart</button><button class="x" data-otaclose aria-label="Later">${ic('x')}</button>`;
  else { el.remove(); return }
}
async function otaCheck(manual){
  if(!IS_APK){ if(manual&&navigator.serviceWorker){ const r=await navigator.serviceWorker.getRegistration(); if(r){ await r.update(); toast('Checked — you have the latest version') } } return }
  if(OTA.state==='busy') return; OTA.state='busy';
  try{
    const r=await fetch(OTA_SITE+'ota/version.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('net');
    const {payload,sig}=await r.json();
    if(!(await verifySig(payload,sig))) throw new Error('signature');
    const m=JSON.parse(payload); const nat=nativeCode(), cur=runningVersion();
    try{ localStorage.setItem('tn-ota-last',JSON.stringify(Date.now())) }catch(e){}
    if(m.apk&&m.apk.code>nat){ OTA.apk={...m.apk,required:(m.minNative||0)>nat}; otaBanner() }
    if((m.minNative||0)<=nat&&vcmp(m.content,cur)>0){
      const files={}, sha={}, bi=builtinFiles();
      for(const [name,f] of Object.entries(m.files)){
        if(bi[name]===f.sha256) continue;              // same as the copy built into the app: nothing to download
        const t=await (await fetch(OTA_SITE+name+'?v='+f.sha256.slice(0,12),{cache:'no-store'})).text();
        if(await sha256hex(t)!==f.sha256) throw new Error('hash '+name);
        files[name]=t; sha[name]=f.sha256;
      }
      if(!files['index.html']) throw new Error('bundle');
      await saveBundle({content:m.content,minNative:m.minNative||0,notes:m.notes||'',at:Date.now(),sha},files);
      OTA.ready=m.content; OTA.notes=m.notes; otaBanner();
    } else if(manual&&!OTA.apk) toast('You have the latest version ('+cur+')');
    OTA.state='';
  }catch(e){ OTA.state=''; if(manual) toast(e.message==='signature'?'Update rejected: signature check failed':'Could not check for updates. Check your internet connection.') }
}
function versionLine(){ return `Trade Nova ${esc(runningVersion())}${IS_APK?' · app '+nativeCode():''}` }
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return; const d=t.dataset;
  if(d.otarestart!==undefined){ location.replace('index.html'); return }
  if(d.otaapk!==undefined&&OTA.apk){ if(window.Android&&Android.open) Android.open(OTA.apk.page||OTA.apk.url); return }
  if(d.otaclose!==undefined){ const b=$('#otaBar'); if(b) b.remove(); return }
  if(d.otacheck!==undefined){ otaCheck(true); return }
});
(function otaInit(){
  try{ localStorage.removeItem('tn-boot-pending') }catch(e){}   // this version started fine
  if(IS_APK){
    let last=0; try{ last=JSON.parse(localStorage.getItem('tn-ota-last'))||0 }catch(e){}
    setTimeout(()=>otaCheck(false), Date.now()-last>3*3600e3?2500:20000);
  } else if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{ const w=reg.installing; w&&w.addEventListener('statechange',()=>{ if(w.state==='installed'&&navigator.serviceWorker.controller){ OTA.ready='new version'; OTA.notes='Tap Restart to load it.'; otaBanner() } }) });
    }).catch(()=>{});
    let reloaded=false; navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(OTA.restarting&&!reloaded){ reloaded=true; location.reload() } });
  }
})();
document.addEventListener('click',e=>{ const t=e.target.closest('[data-otarestart]'); if(t&&!IS_APK){ e.stopImmediatePropagation(); OTA.restarting=true; navigator.serviceWorker.getRegistration().then(r=>{ if(r&&r.waiting) r.waiting.postMessage('skip'); else location.reload() }) } },true);

boot();
</script>
